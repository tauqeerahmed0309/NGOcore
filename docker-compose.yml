version: '3.8'

# ==============================================================================
# NGOcore — Docker Compose Orchestration (MongoDB Atlas Configuration)
# Services:
#   1. frontend — React 19 / Vite SPA served via Nginx with reverse proxy
#   2. backend  — Node.js 20 / Express 5 REST API connected to MongoDB Atlas
#   3. mongodb  — (Optional) Local MongoDB 7.0 (disabled by default via 'local-db' profile)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Database: Optional Local MongoDB 7.0 (Profile: local-db)
  # In MongoDB Atlas testing (default), this container is NOT started.
  # To run with a local database container instead of Atlas:
  #   docker compose --profile local-db up -d --build
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: ngocore-mongodb
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-ngo_records_db}
    volumes:
      - ngocore_mongodb_data:/data/db
    networks:
      - ngocore_network
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Backend API: Node.js 20 LTS Express Application (Connects to MongoDB Atlas)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ngocore-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI environment variable is required for MongoDB Atlas connection}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET environment variable is required and must be at least 32 characters}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-20m}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000,http://localhost:80,http://127.0.0.1:3000,http://localhost:5000}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-10}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@ngo.org}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - AI_PROVIDER=${AI_PROVIDER:-auto}
      - GEMINI_ENABLED=${GEMINI_ENABLED:-false}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_PII_MODE=${GEMINI_PII_MODE:-disabled}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/v1/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ngocore_uploads:/app/uploads
      - ngocore_private_uploads:/app/private-uploads
    networks:
      - ngocore_network

  # ----------------------------------------------------------------------------
  # Frontend: React / Vite SPA served via Nginx Alpine Web Server
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api/v1}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
    container_name: ngocore-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ngocore_network

# ------------------------------------------------------------------------------
# Isolated Internal Network & Persistent Named Volumes
# ------------------------------------------------------------------------------
networks:
  ngocore_network:
    name: ngocore_network
    driver: bridge

volumes:
  ngocore_mongodb_data:
    name: ngocore_mongodb_data
  ngocore_uploads:
    name: ngocore_uploads
  ngocore_private_uploads:
    name: ngocore_private_uploads
